version: "2"

linters:
  default: none
  enable:
    - asciicheck
    - decorder
    - dupword
    - durationcheck
    - forcetypeassert
    - godot
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - nlreturn
    - promlinter
    - reassign
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wsl

formatters:
  enable:
    - gofmt
